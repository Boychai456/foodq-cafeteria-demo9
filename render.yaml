# Render Blueprint: deploy the classroom full-stack demonstration
services:
  - type: web
    name: foodq-classroom-demo
    runtime: python
    region: singapore
    plan: free
    buildCommand: "python -m compileall -q server.py"
    startCommand: "python server.py"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: FOODQ_PUBLIC
        value: "1"
