const newId=()=>globalThis.crypto?.randomUUID?.() || 'fq-'+Date.now()+'-'+Math.random().toString(36).slice(2);
async function createOrder(b){if(!isOffline()){const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const out=await r.json();if(!r.ok)throw Error(out.error||'จองคิวไม่สำเร็จ');return out.order;}
const db=localDB();const quantity=b.items.reduce((s,x)=>s+x.qty,0);const busy=db.orders.filter(o=>o.storeId===b.storeId&&o.date===b.date&&o.pickup===b.pickup&&o.status!=='cancelled').reduce((s,o)=>s+o.items.reduce((z,x)=>z+x.qty,0),0);if(busy+quantity>10)throw Error('คิวช่วงนี้เต็ม กรุณาเลือกเวลาใหม่');const key=`${b.storeId}:${b.date}`;db.counters[key]=(db.counters[key]||0)+1;const items=b.items.map(x=>{const m=MENUS.find(a=>a.id===x.id&&a.storeId===b.storeId);if(!m)throw Error('รายการอาหารไม่ถูกต้อง');return {...m,qty:x.qty}});const order={id:newId(),number:String.fromCharCode(64+b.storeId)+'-'+String(db.counters[key]).padStart(3,'0'),student:b.student,storeId:b.storeId,date:b.date,pickup:b.pickup,items,total:items.reduce((s,x)=>s+x.price*x.qty,0),status:'pending',createdAt:new Date().toISOString()};db.orders.unshift(order);setLocalDB(db);return order;
}
async function updateStatus(id,status){if(!isOffline()){const r=await fetch('/api/orders/'+encodeURIComponent(id)+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});const out=await r.json();if(!r.ok)throw Error(out.error||'อัปเดตไม่สำเร็จ');return;}
const db=localDB();const o=db.orders.find(x=>x.id===id);if(!o)throw Error('ไม่พบรายการ');if((status==='cancelled'&&['pending','accepted'].includes(o.status))||TRANSITIONS[o.status]===status){o.status=status;o.updatedAt=new Date().toISOString();setLocalDB(db)}else throw Error('ไม่สามารถเปลี่ยนสถานะได้');}
async function reset(){if(!isOffline()){const r=await fetch('/api/reset',{method:'POST'});if(!r.ok)throw Error('ล้างข้อมูลไม่สำเร็จ')}else localStorage.removeItem('foodq_db')};
const store=id=>STORES.find(x=>x.id===Number(id));const lines=()=>Object.entries(ui.basket).filter(([id,q])=>q>0).map(([id,qty])=>({...MENUS.find(m=>m.id===+id),qty}));const subtotal=()=>lines().reduce((a,i)=>a+i.qty*i.price,0);const qty=()=>lines().reduce((a,i)=>a+i.qty,0);const myOrders=()=>ui.data.orders.filter(o=>o.student===ui.student&&ui.student).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
function nav(){return `<div class="tabs"><button data-page="home" class="${ui.page==='home'?'active':''}">🏠 ร้านอาหาร</button><button data-page="menu" class="${ui.page==='menu'?'active':''}">🍱 เมนู</button><button data-page="cart" class="${ui.page==='cart'?'active':''}">🛒 ตะกร้า (${qty()})</button><button data-page="orders" class="${ui.page==='orders'?'active':''}">📋 คิวของฉัน (${myOrders().length})</button></div>`}
function home(){const group=['ทั้งหมด','อาหารตามสั่ง','ข้าว','ก๋วยเตี๋ยว','เครื่องดื่ม'];return `<div class="hero"><div class="heroBig"><div style="font-weight:800">สวัสดี ${esc(ui.student||'นักศึกษา')} 👋</div><h1>สั่งล่วงหน้า ไม่ต้องรอคิว!</h1><p>เลือกเมนู จองเวลารับอาหาร และติดตามคิวได้ในหน้าจอเดียว</p></div><div class="heroSmall"><span class="muted">🍽️ โรงอาหาร FoodQ</span><strong>กินอร่อย ได้เร็วขึ้น</strong><div class="big">${ui.data.stores.length} ร้านพร้อมให้บริการ</div><div class="help">สาธิตระบบจองคิวสำหรับนักศึกษา</div></div></div><div class="section"><div class="row wraprow"><h2>เลือกร้านอาหาร</h2><input id="search" class="textbox" style="max-width:290px" placeholder="🔎 ค้นหาชื่อร้าน..." value="${esc(ui.search)}"></div><div class="tabs">${group.map(g=>`<button data-filter="${esc(g)}" class="${ui.filter===g?'active':''}">${esc(g)}</button>`).join('')}</div><div class="grid" id="storeGrid">${STORES.filter(s=>(ui.filter==='ทั้งหมด'||s.kind===ui.filter)&&s.name.includes(ui.search)).map(s=>`<div class="card"><div class="banner" style="background:${s.color}">${s.icon}</div><div class="h3">${s.name}</div><div class="muted sm">${s.kind} · ⭐ 4.8</div><div class="row" style="margin:12px 0"><span class="open">● เปิดรับจอง</span><span class="sm muted">⏱ ${s.wait}</span></div><button class="btn wide" data-store="${s.id}">ดูเมนูและจองคิว →</button></div>`).join('')||'<div class="empty">ไม่พบร้านอาหาร</div>'}</div></div>`}
function menu(){const s=store(ui.selectedStore);const items=MENUS.filter(x=>x.storeId===s.id);return `<section class="section"><div class="row wraprow"><div><span class="muted sm">ร้านอาหาร / เลือกเมนู</span><h2>${s.icon} ${esc(s.name)}</h2><span class="open">เปิดรับจอง</span> <span class="muted sm">เวลาเตรียม ${s.wait}</span></div><button class="btn alt" data-page="home">← เปลี่ยนร้าน</button></div></section><div class="layout"><div class="surface"><h2>🍱 เลือกเมนูอาหาร</h2><div class="menu">${items.map(m=>`<div class="menuitem"><div class="photo ${m.pic}"></div><div class="dish"><div class="name">${m.name}</div><div style="color:var(--orange);font-weight:800">${money(m.price)}</div></div><button class="btn alt" data-add="${m.id}" aria-label="เพิ่ม ${esc(m.name)}">＋</button></div>`).join('')}</div></div>${cartSummary()}</div>`}
function cartSummary(){return `<div class="surface"><div class="row"><h2>🛒 ตะกร้าของฉัน</h2><span class="pill">${qty()} จาน</span></div>${lines().length?lines().map(i=>`<div class="cartline row"><div><b>${esc(i.name)}</b><div class="sm muted">${money(i.price)} / จาน</div></div><div class="stepper"><button data-dec="${i.id}">−</button><b>${i.qty}</b><button data-add="${i.id}">+</button></div></div>`).join(''):'<div class="empty">ยังไม่มีอาหารในตะกร้า</div>'}<hr class="divider"><div class="row"><b>รวมทั้งหมด</b><span class="total">${money(subtotal())}</span></div><button class="btn orange wide" style="margin-top:16px" data-page="cart" ${qty()?'':'disabled'}>เลือกเวลารับอาหาร →</button></div>`}
function cart(){const s=store(ui.selectedStore);const occ=p=>ui.data.orders.filter(o=>o.storeId===s.id&&o.date===ui.date&&o.pickup===p&&o.status!=='cancelled').reduce((z,o)=>z+o.items.reduce((t,i)=>t+i.qty,0),0);return `<div class="section"><h2>📅 เลือกวันและเวลารับอาหาร</h2><div class="notice">${s.icon} ${s.name} · จำกัด 10 จานต่อช่วงเวลา 15 นาที · ในตัวอย่างนี้ <b>จ่ายเงินที่ร้าน</b></div></div><div class="checkout"><div class="surface"><b>วันที่รับอาหาร</b><div class="tabs" style="margin-top:10px">${dates.map(d=>`<button data-date="${d.value}" class="${ui.date===d.value?'active':''}">${d.label}</button>`).join('')}</div><b>เวลารับอาหาร</b><div class="slots" style="margin-top:10px">${slots.map(p=>{const remain=Math.max(0,10-occ(p));return `<button data-slot="${p}" class="${ui.pickup===p?'active':''}" ${remain<qty()?'disabled':''}>${p}<div class="tiny">เหลือ ${remain} จาน</div></button>`}).join('')}</div><div class="help" style="margin-top:12px">เลือกเวลาที่มีความจุเพียงพอกับจำนวนจานที่สั่ง</div><hr class="divider"><label><b>ชื่อนักศึกษา</b><input id="studentName" class="textbox" value="${esc(ui.student)}" placeholder="กรอกชื่อเพื่อจองคิว" maxlength="70"></label></div><div class="surface"><h2>ตรวจสอบก่อนยืนยัน</h2>${lines().map(i=>`<div class="cartline row"><span>${esc(i.name)} × ${i.qty}</span><b>${money(i.qty*i.price)}</b></div>`).join('')||'<div class="empty">กรุณาเลือกอาหารก่อน</div>'}<div class="row" style="margin:15px 0"><b>รวม</b><b class="total">${money(subtotal())}</b></div><div class="notice"><div>🗓️ ${ui.date}</div><div>⏰ เวลา ${ui.pickup} น.</div><div>💵 จ่ายเงินสดที่ร้าน (จำลอง)</div></div><button class="btn orange wide" data-confirm="1" ${!qty()?'disabled':''}>✅ ยืนยันจองคิว</button><button class="btn line wide" style="margin-top:9px" data-page="menu">← กลับไปแก้ไขเมนู</button></div></div>`}
function orderCard(o,mode){const s=store(o.storeId);const allowed=TRANSITIONS[o.status];return `<article class="order"><div class="row wraprow"><div><div class="muted tiny">${esc(s.name)} · ${o.date} เวลา ${o.pickup}</div><div class="queue">${esc(o.number)}</div></div><span class="status ${o.status}">${STATUS[o.status]}</span></div><div class="sm" style="margin:8px 0">${o.items.map(i=>esc(i.name)+' × '+i.qty).join(' · ')} · <b>${money(o.total)}</b></div>${mode==='merchant'?`<div class="sm muted">ผู้จอง: ${esc(o.student)}</div><div class="row wraprow" style="margin-top:12px">${allowed?`<button class="btn orange" data-next="${o.id}" data-status="${allowed}">${ACTIONS[o.status]} →</button>`:''}${['pending','accepted'].includes(o.status)?`<button class="btn danger" data-next="${o.id}" data-status="cancelled">ยกเลิก</button>`:''}</div>`: `<div class="help">${o.status==='ready'?'✅ อาหารพร้อมแล้ว แสดงเลขคิวที่ร้านได้เลย':o.status==='completed'?'รับอาหารเรียบร้อย ขอบคุณที่ใช้ FoodQ':o.status==='cancelled'?'รายการนี้ถูกยกเลิก':'กรุณารอร้านอัปเดตสถานะ'}</div>${['pending','accepted'].includes(o.status)?`<button class="btn danger" style="margin-top:12px" data-next="${o.id}" data-status="cancelled">ยกเลิกการจอง</button>`:''}`}</article>`}
function orders(){return `<div class="section row wraprow"><h2>📋 หมายเลขคิวของฉัน</h2><button class="btn alt" data-refresh="1">↻ อัปเดตสถานะ</button></div>${myOrders().length?myOrders().map(o=>orderCard(o,'student')).join(''):'<div class="empty">ยังไม่มีคิวของคุณ ลองเลือกร้านและจองอาหารได้เลย</div>'}`}
function merchant(){const l=ui.data.orders.filter(o=>o.storeId===ui.merchantStore);const active=l.filter(o=>!['completed','cancelled'].includes(o.status));return `<div class="hero" style="grid-template-columns:1fr"><div class="heroBig"><div class="sm">Merchant Dashboard</div><h1>🍳 จัดการคิวร้านค้า</h1><p>รับรายการ เริ่มทำ แจ้งพร้อมรับ และยืนยันส่งมอบ</p></div></div><div class="section"><div class="row wraprow"><h2>เลือกร้านอาหาร</h2><select id="merchantStore" class="textbox" style="max-width:290px">${STORES.map(s=>`<option value="${s.id}" ${s.id===ui.merchantStore?'selected':''}>${s.name}</option>`).join('')}</select></div></div><div class="statgrid">${[['ออร์เดอร์ทั้งหมด',l.length],['กำลังรอ/เตรียม',active.length],['พร้อมรับ',l.filter(o=>o.status==='ready').length],['ส่งมอบแล้ว',l.filter(o=>o.status==='completed').length]].map(([n,v])=>`<div class="stat"><div class="muted sm">${n}</div><strong>${v}</strong></div>`).join('')}</div><div class="section"><div class="row"><h2>รายการคิวของร้าน</h2><button class="btn alt" data-refresh="1">↻ รีเฟรช</button></div>${l.length?l.map(o=>orderCard(o,'merchant')).join(''):'<div class="empty">ยังไม่มีออร์เดอร์ในร้านนี้ ทดลองจองที่หน้านักศึกษา</div>'}</div>`}
function admin(){const os=ui.data.orders;return `<div class="hero" style="grid-template-columns:1fr"><div class="heroBig"><div class="sm">FoodQ Analytics</div><h1>📊 ภาพรวมระบบโรงอาหาร</h1><p>รายงานการจองคิวของทุกกิจการ (ข้อมูลเพื่อการเรียน)</p></div></div><div class="statgrid"><div class="stat">ออร์เดอร์ทั้งหมด<strong>${os.length}</strong></div><div class="stat">ร้านอาหาร<strong>${STORES.length}</strong></div><div class="stat">คิวที่ยังไม่เสร็จ<strong>${os.filter(x=>!['completed','cancelled'].includes(x.status)).length}</strong></div><div class="stat">ยอดขายที่ส่งมอบ<strong>${os.filter(x=>x.status==='completed').reduce((s,o)=>s+o.total,0)} ฿</strong></div></div><div class="section surface"><h2>รายงานตามร้านค้า</h2>${STORES.map(s=>{const a=os.filter(o=>o.storeId===s.id);return `<div class="row cartline"><span>${s.icon} ${esc(s.name)}</span><b>${a.length} ออร์เดอร์</b></div>`}).join('')}<p class="help">ปุ่มต่อไปนี้ใช้สำหรับเริ่มการสาธิตใหม่เท่านั้น</p>${ui.data.publicDemo?'': '<button class="btn danger" data-reset="1">ล้างข้อมูลทดลองทั้งหมด</button>'}</div>`}
function render(){document.querySelectorAll('[data-role]').forEach(b=>b.classList.toggle('active',b.dataset.role===ui.role));const badge=document.getElementById('modeBadge');badge.textContent=isOffline()?'🟡 โหมดไม่ใช้เซิร์ฟเวอร์':'🟢 เชื่อมต่อ Backend แล้ว';badge.classList.toggle('offline',isOffline());const area=document.getElementById('app');area.innerHTML=ui.role==='student'?nav()+(ui.page==='home'?home():ui.page==='menu'?menu():ui.page==='cart'?cart():orders()):ui.role==='merchant'?merchant():admin();}
async function rerender(){await load();render()}
document.addEventListener('click',async ev=>{const b=ev.target.closest('button');if(!b)return;try{
  if(b.dataset.role){ui.role=b.dataset.role;render();return;}
  if(b.dataset.page){ui.page=b.dataset.page;render();return;}
  if(b.dataset.filter){ui.filter=b.dataset.filter;render();return;}
  if(b.dataset.store){ui.selectedStore=+b.dataset.store;ui.basket={};ui.page='menu';render();return;}
  if(b.dataset.add){const id=Number(b.dataset.add);ui.basket[id]=Math.min(10,(ui.basket[id]||0)+1);toast('เพิ่มลงตะกร้าแล้ว');render();return;}
  if(b.dataset.dec){const id=Number(b.dataset.dec);ui.basket[id]=Math.max(0,(ui.basket[id]||0)-1);render();return;}
  if(b.dataset.date){ui.date=b.dataset.date;render();return;}
  if(b.dataset.slot){ui.pickup=b.dataset.slot;render();return;}
  if(b.dataset.confirm){const n=document.getElementById('studentName');ui.student=(n?.value||'').trim();if(!ui.student)throw Error('กรุณากรอกชื่อนักศึกษา');if(!qty())throw Error('กรุณาเลือกอาหาร');localStorage.setItem('foodq_student',ui.student);b.disabled=true;const ord=await createOrder({student:ui.student,storeId:ui.selectedStore,date:ui.date,pickup:ui.pickup,items:lines().map(x=>({id:x.id,qty:x.qty}))});ui.basket={};ui.page='orders';toast('🎉 จองสำเร็จ หมายเลขคิว '+ord.number);await rerender();return;}
  if(b.dataset.next){if(b.dataset.status==='cancelled'&&!confirm('ต้องการยกเลิกออร์เดอร์นี้ใช่หรือไม่?'))return;await updateStatus(b.dataset.next,b.dataset.status);toast('เปลี่ยนสถานะสำเร็จ');await rerender();return;}
  if(b.dataset.refresh){await rerender();toast('อัปเดตข้อมูลล่าสุดแล้ว');return;}
  if(b.dataset.reset){if(!confirm('ล้างข้อมูลทดลองทั้งหมด?'))return;await reset();ui.basket={};toast('ล้างข้อมูลเรียบร้อย');await rerender();return;}
}catch(e){toast('⚠️ '+(e.message||e));console.error(e)}});
document.addEventListener('change',e=>{if(e.target.id==='merchantStore'){ui.merchantStore=Number(e.target.value);render()}if(e.target.id==='studentName'){ui.student=e.target.value.trim();localStorage.setItem('foodq_student',ui.student)}});
document.addEventListener('input',e=>{if(e.target.id==='search'){ui.search=e.target.value;document.querySelectorAll('#storeGrid .card').forEach(c=>{const storeName=c.querySelector('.h3')?.textContent||'';c.style.display=storeName.includes(ui.search)?'':'none'})}});
(async()=>{try{await load();render()}catch(e){console.error(e);document.getElementById('app').innerHTML='<div class="surface section">เปิดหน้า FoodQ ไม่สำเร็จ กรุณารีเฟรชอีกครั้ง</div>'}})();
</script></body></html>
